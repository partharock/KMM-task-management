name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build Shared Framework
        # This compiles the Kotlin code into an iOS framework
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        
      - name: Build iOS App (Archiving)
        # In a real scenario, you use xcodebuild here
        # This step depends on having your Xcode project set up correctly
        run: |
          cd iosApp
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO
            
      # (Optional) Verify Tests
      - name: Run iOS Unit Tests
        run: ./gradlew :shared:iosX64Test